<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Login - SkinAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="login-icon mb-3">
                <i class="fas fa-microscope fa-2x"></i>
            </div>
            <div class="login-title">SkinAI</div>
            <p class="login-subtitle">Détection intelligente du cancer de la peau</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="alert alert-{{ cat }} rounded-3">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="fas fa-user me-1"></i> Nom d'utilisateur
                </label>
                <input type="text" name="username" class="form-control" placeholder="Entrez votre username" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">
                    <i class="fas fa-lock me-1"></i> Mot de passe
                </label>
                <input type="password" name="password" class="form-control" placeholder="Entrez votre mot de passe" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="fas fa-sign-in-alt me-2"></i> Se connecter
            </button>
        </form>
    </div>
</div>
</body>
</html>
